openapi: 3.0.3
info:
  title: Hub API
  description: APIs for dashboard and transmission
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Dashboard
  - name: Transmission
  - name: Configuration

paths:
  /system-configuration:
    get:
      tags:
        - Configuration
      summary: Get system configuration
      operationId: getSystemConfiguration
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemConfiguration"
  /containers/{containerId}/pack-metrics:
    get:
      tags:
        - Dashboard
      operationId: getContainerPackMetrics
      description: get the metrics of all packs in a container
      parameters:
        - $ref: "#/components/parameters/containerId"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerPackMetricsResponse"
  /containers/{containerId}/pack-metrics/{packId}:
    get:
      tags:
        - Dashboard
      summary: Get the metrics of a pack
      operationId: getPackMetrics
      parameters:
        - $ref: "#/components/parameters/containerId"
        - $ref: "#/components/parameters/packId"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackMetricsResponse"
  /containers/{containerId}/packs/{packId}/cells-metrics/{cellId}:
    get:
      tags:
        - Dashboard
      summary: Get the metrics of a cell
      operationId: getCellMetrics
      parameters:
        - $ref: "#/components/parameters/containerId"
        - $ref: "#/components/parameters/packId"
        - $ref: "#/components/parameters/cellId"
        - $ref: "#/components/parameters/dateFrom"
        - $ref: "#/components/parameters/dateTo"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CellMetricsResponse"
  /overview:
    get:
      tags:
        - Dashboard
      summary: Get dashboard overview
      operationId: getDashboardOverview
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /transmit-data:
    post:
      tags:
        - Transmission
      summary: transmit data to the server
      operationId: transmitData
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransmitDataRequest"
      responses:
        "201":
          description: Successful response
components:
  schemas:
    TransmitDataRequest:
      type: object
      properties:
        eisMeasurements:
          type: array
          items:
            $ref: "#/components/schemas/EisMeasurement"
        generatedRecords:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedRecord"
        packMetricsRecords:
          type: array
          items:
            $ref: "#/components/schemas/PackMetricsRecord"
    PackMetricsResponse:
      type: object
      properties:
        packHistogram:
          $ref: "#/components/schemas/PackHistogram"
        metrics:
          $ref: "#/components/schemas/PackMetrics"
        suggestion:
          type: string
        characteristicFrequencies:
          $ref: "#/components/schemas/CharacteristicFrequencies"
    CharacteristicFrequencies:
      type: object
      properties:
        impedance10Hz:
          type: number
          format: double
        impedance10000Hz:
          type: number
          format: double
    EisMeasurement:
      type: object
      properties:
        containerId:
          type: string
        clusterId:
          type: string
        packId:
          type: string
        cellId:
          type: string
        realImpedance:
          type: number
          format: double
        frequency:
          type: number
          format: double
        imaginaryImpedance:
          type: number
          format: double
        voltage:
          type: number
          format: double
        creationTime:
          type: string
          format: date-time
        temperature:
          type: number
          format: double
    Diagnostic:
      type: object
      properties:
        seiParameter:
          type: integer
        temperature:
          type: number
          format: double
        dendritesParameter:
          type: integer
        electrolyteParameter:
          type: integer
        polarizationPotential:
          type: number
          format: double
        conductivity:
          type: number
          format: double
    Cluster:
      type: object
      properties:
        id:
          type: string
        packs:
          type: array
          items:
            type: string
    Container:
      type: object
      properties:
        id:
          type: string
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/Cluster"
    SystemConfiguration:
      type: object
      properties:
        containers:
          type: array
          items:
            $ref: "#/components/schemas/Container"
        packType:
          type: string
          enum: ["pack52", "pack104"]
    Overview:
      type: object
      properties:
        monthlyInspections:
          type: integer
        totalInspections:
          type: integer
          format: int64
        totalMeasurements:
          type: integer
          format: int64
        totalRiskySamples:
          type: integer
        cumulativeRiskIdentifications:
          type: integer
        lastUpdatedAt:
          type: string
          format: date-time
        alertTexts:
          type: array
          items:
            type: string
    PackOverview:
      type: object
      properties:
        packId:
          type: string
        dispersionCoefficient:
          type: number
          format: double
        averageImpedanceRecords:
          type: array
          items:
            $ref: "#/components/schemas/AverageImpedanceRecord"
    ListPackOverviewsResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/PackOverview"
    AverageImpedanceRecord:
      type: object
      properties:
        frequency:
          type: number
          format: double
        averageImpedance:
          type: number
          format: double
    PackMetrics:
      type: object
      properties:
        absImpedanceMean:
          type: number
          format: double
        impedanceStdDev:
          type: number
          format: double
        coefficientOfVariation:
          type: number
          format: double
        dispersion:
          type: number
          format: double
        degradationLevel:
          type: string
    PackHealth:
      type: object
      properties:
        safetyRate:
          type: number
          format: double
        creationTime:
          type: string
          format: date
    GeneratedRecord:
      type: object
      properties:
        containerId:
          type: string
        clusterId:
          type: string
        packId:
          type: string
        cellId:
          type: string
        creationTime:
          type: string
          format: date-time
        dispersionCoefficient:
          type: number
          format: double
        temperature:
          type: number
          format: double
        seiParameter:
          type: integer
        dendritesParameter:
          type: integer
        electrolyteParameter:
          type: integer
        polarizationPotential:
          type: number
          format: double
        conductivity:
          type: number
          format: double
    PackMetricsRecord:
      type: object
      properties:
        containerId:
          type: string
        clusterId:
          type: string
        packId:
          type: string
        creationTime:
          type: string
          format: date-time
        dispersionCoefficient:
          type: number
          format: double
        safetyRate:
          type: number
          format: double
    PackHistogram:
      type: array
      items:
        $ref: "#/components/schemas/PackHistogramPoint"
    PackHistogramPoint:
      type: object
      properties:
        absImpedanceMean:
          type: number
          format: double
        maxAbsImpedance:
          type: number
          format: double
        minAbsImpedance:
          type: number
          format: double
        impedanceStdDev:
          type: number
          format: double
    ClusterPackHistogram:
      type: object
      properties:
        packId:
          type: string
        packHistogram:
          type: array
          items:
            $ref: "#/components/schemas/PackHistogramPoint"
    ClusterHistogram:
      type: array
      items:
        $ref: "#/components/schemas/ClusterPackHistogram"
    CellHistogram:
      type: array
      items:
        $ref: "#/components/schemas/CellHistogramPoint"
    CellHistogramPoint:
      type: object
      properties:
        absImpedanceMean:
          type: number
          format: double
        impedanceStdDev:
          type: number
          format: double
        coefficientOfVariation:
          type: number
          format: double
    CellMetricsResponse:
      type: object
      properties:
        histogram:
          $ref: "#/components/schemas/CellHistogram"
        nyquistPlot:
          $ref: "#/components/schemas/NyquistPlot"
        bodePlot:
          $ref: "#/components/schemas/BodePlot"
        drtPlot:
          $ref: "#/components/schemas/DrtPlot"
        impedanceMeanMatrix:
          $ref: "#/components/schemas/Matrix"
        impedanceStdDevMatrix:
          $ref: "#/components/schemas/Matrix"
        metrics:
          $ref: "#/components/schemas/CellMetrics"
        equivalentCircuitDiagram:
          $ref: "#/components/schemas/EquivalentCircuitDiagram"
    EquivalentCircuitDiagram:
      type: object
      properties:
        r1:
          type: number
          format: double
        rct:
          type: number
          format: double
        cdl:
          type: number
          format: double
        zw:
          type: number
          format: double
        rb:
          type: number
          format: double
    NyquistPlot:
      type: array
      items:
        $ref: "#/components/schemas/NyquistPlotPoint"
    NyquistPlotPoint:
      type: object
      properties:
        frequency:
          type: number
          format: double
        realImpedance:
          type: number
          format: double
        imaginaryImpedance:
          type: number
          format: double
    BodePlot:
      type: array
      items:
        $ref: "#/components/schemas/BodePlotPoint"
    BodePlotPoint:
      type: object
      properties:
        frequency:
          type: number
          format: double
        phase:
          type: number
          format: double
    DrtPlot:
      type: array
      items:
        $ref: "#/components/schemas/DrtPlotPoint"
    DrtPlotPoint:
      type: object
      properties:
        a:
          type: number
    Matrix:
      type: array
      items:
        type: array
        items:
          type: number
          format: float
    CellMetrics:
      type: object
      properties:
        maxImpedanceStdDev:
          type: number
          format: double
        minImpedanceStdDev:
          type: number
          format: double
        maxAbsImpedance:
          type: number
          format: double
        minAbsImpedance:
          type: number
          format: double
        maxCoefficientOfVariation:
          type: number
          format: double
        minCoefficientOfVariation:
          type: number
          format: double
        absImpedanceMean:
          type: number
          format: double
        impedanceStdDev:
          type: number
          format: double
        coefficientOfVariation:
          type: number
          format: double
        impedanceMeanTomaxRatio:
          type: number
          format: double
        impedanceMeanToMinRatio:
          type: number
          format: double
        impedanceMeanToAvgRatio:
          type: number
          format: double
        impedanceStdDevToMaxRatio:
          type: number
          format: double
        impedanceStdDevToMinRatio:
          type: number
        impedanceStdDevToAvgRatio:
          type: number
          format: double
    ContainerPackMetricsResponse:
      type: object
      properties:
        packHistograms:
          $ref: "#/components/schemas/ClusterHistogram"

  parameters:
    containerId:
      in: path
      required: true
      name: containerId
      schema:
        type: string
    packId:
      in: path
      required: true
      name: packId
      schema:
        type: string
    cellId:
      in: path
      required: true
      name: cellId
      schema:
        type: string
    clusterId:
      in: path
      schema:
        type: string
      required: true
      name: clusterId
    dateFrom:
      in: query
      schema:
        type: string
        format: date-time
      required: false
      name: dateFrom
    dateTo:
      in: query
      schema:
        type: string
        format: date-time
      required: false
      name: dateTo
